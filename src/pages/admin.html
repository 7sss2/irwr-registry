<main id="main" tabindex="-1">
<section class="admin-form reveal wrap">
  <h1>GBR Admin</h1>
  <p class="admin-note">Internal use only. No live authentication on this build.</p>
  <form onsubmit="event.preventDefault();">
    <label for="adminEmail">Email</label>
    <input type="email" id="adminEmail" placeholder="you@globalbestrecords.org" autocomplete="username">
    <label for="adminPass">Password</label>
    <input type="password" id="adminPass" placeholder="••••••••" autocomplete="current-password">
    <button type="submit" class="btn-gold-lg" data-ripple>Sign in</button>
  </form>
</section>
</main>
